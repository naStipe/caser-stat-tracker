<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pulse monitor</title>
<style>
  :root {
    --bg: #0f1114;
    --panel: #15181c;
    --line: #22272e;
    --text: #e6e8eb;
    --muted: #9aa1ab;
    --faint: #6b7480;
    --pos: #45c486;
    --neg: #ef6b6b;
    --accent: #7ea6f6;
    --warn: #d8a650;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 14px; font-weight: 600; margin: 0; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 10px; }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; background: var(--bg); margin: 0 0 16px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .tabs .label { margin-left: 0; }
  .tab-list { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: -7px; }
  .tab-list::-webkit-scrollbar { display: none; }
  .tab-list button { border: 0; border-radius: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); white-space: nowrap; }
  .tab-list button:hover { background: transparent; color: var(--text); }
  .tab-list button.on { background: transparent; color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .status { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 460px; font-size: 12.5px; color: var(--muted); padding: 3px 10px; border-radius: 999px; }
  .status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .status.ok i { background: var(--pos); }
  .status.bad i { background: var(--neg); }
  .tbl-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-bottom: 8px; }
  .tbl-tools input { width: 200px; padding: 5px 9px; font-size: 13px; }
  .tbl-tools input.min { width: 84px; }
  .tbl-tools .label { margin-left: 0; }
  button.link { border: 0; padding: 0; color: var(--accent); font-size: 12.5px; }
  button.link:hover { background: transparent; text-decoration: underline; }
  th button.sort { border: 0; padding: 0; border-radius: 0; color: inherit; font-weight: inherit; }
  th button.sort:hover { background: transparent; color: var(--text); }
  th.sorted { color: var(--text); }
  th .arrow { display: inline-block; width: 1em; text-align: center; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .hint { color: var(--faint); font-size: 12.5px; margin: 10px 0 0; }
  .pos { color: var(--pos); }
  .neg { color: var(--neg); }
  .warn-text { color: var(--warn); }
  .num { font-variant-numeric: tabular-nums; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; max-width: 100%; }
  .group { display: inline-flex; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; scrollbar-width: none; }
  .group::-webkit-scrollbar { display: none; }
  .group button { flex: none; }
  .group button { border: 0; border-radius: 0; border-right: 1px solid var(--line); }
  .group button:last-child { border-right: 0; }
  .label { color: var(--faint); font-size: 12.5px; margin: 0 2px 0 6px; }
  button, input { font: inherit; color: inherit; }
  button { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; transition: background 120ms, border-color 120ms; }
  button:hover { background: #1b1f24; }
  button.on { background: var(--text); color: var(--bg); }
  button.primary { background: var(--accent); color: #0b0d10; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: default; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  label { display: block; color: var(--muted); font-size: 12.5px; margin: 12px 0 4px; }
  .login { max-width: 360px; margin: 10vh auto 0; }
  .login button { width: 100%; margin-top: 16px; padding: 9px; }
  .error { color: var(--neg); margin: 10px 0 0; }
  .case-form { display: flex; gap: 8px; margin: 0 0 12px; }
  .case-form input { flex: 1; min-width: 0; }
  .case-form button { flex: none; }
  .linkish { border: 0; padding: 0; background: none; color: inherit; text-align: left; text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
  .linkish:hover { background: none; color: var(--text); }
  .health { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-left: 3px solid var(--line); }
  .health.ok { border-left-color: var(--pos); }
  .health.warn { border-left-color: var(--warn); }
  .health.bad { border-left-color: var(--neg); }
  .health .state { font-weight: 600; }
  .health.warn .state { color: var(--warn); }
  .health.bad .state { color: var(--neg); }
  .events { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13px; }
  .events li { display: grid; grid-template-columns: 70px 92px 1fr; gap: 10px; padding: 5px 0; border-top: 1px solid var(--line); }
  .events .lv-error { color: var(--neg); }
  .events .lv-warn { color: var(--warn); }
  .events .lv-info { color: var(--faint); }
  .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .glance section { margin: 0; border-left-width: 3px; }
  .glance .good { border-left-color: var(--pos); }
  .glance .bad { border-left-color: var(--neg); }
  .glance-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .glance .kind { color: var(--muted); font-size: 12.5px; }
  .glance .chart { margin: 2px 0 6px; }
  .big { font-size: 30px; font-weight: 600; line-height: 1.1; text-align: right; }
  .big small { display: block; font-size: 12px; font-weight: 400; color: var(--faint); }
  .readout.small { min-height: 20px; font-size: 12.5px; margin: 2px 0 0; }
  .predicts { font-size: 13px; margin-top: 6px; }
  .small-text { font-size: 12.5px; }
  .headline { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .kpi .k { color: var(--muted); font-size: 12.5px; }
  .kpi .v { font-size: 22px; font-weight: 600; }
  .kpi .s { color: var(--faint); font-size: 12.5px; }
  .chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .chart text { fill: var(--faint); font-size: 11px; font-family: inherit; }
  .readout { min-height: 42px; font-size: 13px; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 6px; }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend .legend-item { border: 0; padding: 0; font: inherit; color: inherit; transition: opacity 120ms; }
  .legend .legend-item:hover { color: var(--text); }
  .legend .legend-item i { height: 3px; border-radius: 2px; }
  .split { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 12px; }
  .split h3 { font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  td .ci { display: block; color: var(--faint); font-size: 11.5px; }
  .fade { animation: fade 160ms ease-out; }
  @keyframes fade { from { opacity: 0.4; } to { opacity: 1; } }
  .sync { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sync.busy { color: var(--muted); }
  .sync.bad { color: var(--neg); }
  .sync .bar { flex: none; width: 72px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; transition: opacity 200ms; }
  .sync.busy .bar { opacity: 1; }
  .sync .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 200ms ease-out; }
  @media (max-width: 520px) { .sync .bar { width: 40px; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } button, .sync .bar, .sync .bar i { transition: none; } }
</style>
</head>
<body>
<main id="root"><p class="faint">Loading…</p></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import { SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY } from './config.js';
import { CASE_RANGES, caseSlugFrom, caseSpec, caseReport, watchReport, playerIdFrom } from './case.js';
import { RANGES, KINDS, windowsFor, pickWindow, rangeSpec, compareSpec, buildReport, monitorHealth, CHANCE_GROUPS, BANDS, PHASES, situation, PREDICT_WINDOWS, SHARED_WINDOWS, SHARED_DAYS, sharedShift, depositCheck, DEPOSIT_MIN_SEEN, FEED_TIERS, FEED_MIN_SEEN, WINDOWS, feedReport, arrivalShare, ARRIVAL_MIN_WINDOWS } from './view.js';

const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
const root = document.getElementById('root');
const HOUR = 3600000;
const COLORS = { line: '#7ea6f6', grid: '#22272e', zero: '#3a414b', pos: '#45c486', neg: '#ef6b6b', whisker: '#c3c8cf', marker: '#e6e8eb', diag: '#6b7480', bg: '#15181c', warn: '#d8a650', bar: '#2c323a' };
const DASH = '–';
const ok = (v) => typeof v === 'number' && Number.isFinite(v);
const fmt = (v, d = 0) => (ok(v) ? v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : DASH);
const fmt3 = (v) => fmt(v, 3);
const fmt2 = (v) => fmt(v, 2);
const fmtInt = (v) => fmt(v, 0);
const pct = (v, d = 1) => (ok(v) ? `${fmt(v * 100, d)}%` : DASH);
const fmtAgo = (t) => {
  const s = Math.max(0, Math.round((Date.now() - t) / 1000));
  return s < 60 ? `${s} s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 172800 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} days ago`;
};
const sign = (v) => (!ok(v) ? 'faint' : v > 1e-9 ? 'pos' : v < -1e-9 ? 'neg' : '');
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
const NAMES = { upgrade: ['Upgrades', 'upgrades', 'vs normal', 'wins against the usual rate for the same chance and session phase (last 7 days)'], case: ['Cases', 'case opens', 'hit index', 'opens worth at least the case price, against each case’s usual rate (last 7 days)'] };
/** What a chart can show, per kind: [value, button text, tooltip]. */
const METRICS = {
  upgrade: [['index', 'vs normal', NAMES.upgrade[3]], ['shown', 'vs shown odds', 'wins against what the shown chances predict'], ['money', 'return per 1', 'total received per 1 staked']],
  case: [['index', 'hit index', NAMES.case[3]], ['money', 'return per 1', 'total received per 1 staked']],
};
const metricName = (kind, m) => (METRICS[kind].find(([v]) => v === m) ?? METRICS[kind][0])[1];

let rangeKey = RANGES[store.get('pulse.range')] ? store.get('pulse.range') : '1h';
let windowMin = pickWindow(rangeKey, store.get(`pulse.window.${rangeKey}`));
let compareMin = Number(store.get('pulse.compare', 30)) === 60 ? 60 : 30;
let weekCache = null; // the 7-day report in 30-minute buckets (self-check, lookup, day by day, heat map), reused for 10 minutes
let pickBand = store.get('pulse.band', 'b');
let pickPhase = Number(store.get('pulse.phase', 1));
let predictMin = PREDICT_WINDOWS.includes(Number(store.get('pulse.predict', 10))) ? Number(store.get('pulse.predict', 10)) : 10;
const predictCache = new Map(); // window minutes -> {at, rows} from monitor_window_sums, reused for 10 minutes
let sharedMin = SHARED_WINDOWS.includes(Number(store.get('pulse.shared.win', 60))) ? Number(store.get('pulse.shared.win', 60)) : 60;
let sharedDays = SHARED_DAYS.includes(Number(store.get('pulse.shared.days', 30))) ? Number(store.get('pulse.shared.days', 30)) : 30;
const sharedCache = new Map(); // `${days}/${minutes}` -> {at, data} from monitor_shared, reused for 10 minutes
let sharedError = null;
const arrivalCache = new Map(); // compare minutes -> {at, data} from monitor_arrival, reused for 10 minutes
let arrivalError = null;
const metric = {};
for (const k of KINDS) { const m = store.get(`pulse.metric.${k}`, 'index'); metric[k] = METRICS[k].some(([v]) => v === m) ? m : 'index'; }
let heatKind = store.get('pulse.heat', 'upgrade');
let view = null;
let health = null;
let events = [];
let session = null;
let loading = false;
let loadError = null;

/**
 * The indicator next to Reload: while requests to the database run, a bar fills as they finish ("Updating 3/7",
 * with the seconds so far once it takes a while); otherwise when the page last updated and when it updates next.
 * It lives outside the re-rendered page and repaints itself every second.
 */
const sync = { active: 0, done: 0, total: 0, since: 0, lastAt: 0, failedAt: 0, nextAt: 0 };
const syncFill = document.createElement('i');
const syncBar = document.createElement('span');
syncBar.className = 'bar';
syncBar.append(syncFill);
const syncText = document.createElement('span');
const syncEl = document.createElement('span');
syncEl.title = 'Requests to the database: finished of started. The page updates every minute while it is open.';
syncEl.append(syncBar, syncText);
function paintSync() {
  const now = Date.now();
  const busy = sync.active > 0;
  const failed = !busy && sync.failedAt > sync.lastAt;
  syncEl.className = `sync${busy ? ' busy' : failed ? ' bad' : ''}`;
  syncFill.style.width = busy ? `${Math.max(6, (100 * sync.done) / sync.total)}%` : '100%';
  const secs = Math.floor((now - sync.since) / 1000);
  syncText.textContent = busy ? `Updating ${sync.done}/${sync.total}${secs >= 2 ? ` · ${secs} s` : ''}`
    : failed ? `Update failed ${fmtAgo(sync.failedAt)}`
    : sync.lastAt ? `Updated ${fmtAgo(sync.lastAt)}${sync.nextAt > now ? ` · next in ${Math.ceil((sync.nextAt - now) / 1000)} s` : ''}`
    : '';
}
/** Counts a request (or a wait for one) in the indicator until it settles. */
function track(p) {
  if (!sync.active) { sync.done = 0; sync.total = 0; sync.since = Date.now(); }
  sync.active++;
  sync.total++;
  paintSync();
  return Promise.resolve(p).finally(() => { sync.active--; sync.done++; paintSync(); });
}
setInterval(() => { if (!document.hidden) paintSync(); }, 1000);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'text') el.textContent = v;
    else if (k === 'class') el.className = Array.isArray(v) ? v.filter(Boolean).join(' ') : v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) el.append(c);
  return el;
}
function s(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'text') el.textContent = v;
    else el.setAttribute(k, v);
  }
  return el;
}
function toggle(options, current, onPick, label) {
  return h('span', { class: 'row' }, label ? h('span', { class: 'label', text: label }) : null,
    h('span', { class: 'group', role: 'group' }, options.map(([v, text, title]) => h('button', { type: 'button', class: String(v) === String(current) ? 'on' : '', 'aria-pressed': String(String(v) === String(current)), title, text, onclick: () => onPick(v) }))));
}

function timeLabel(t, span) {
  const d = new Date(t);
  if (span <= 24 * HOUR) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (span <= 7 * 24 * HOUR) return d.toLocaleString([], { weekday: 'short', hour: '2-digit' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
function spanLabel(a, b) {
  const da = new Date(a), db = new Date(b);
  const t = (d) => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const day = da.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  return b - a >= 24 * HOUR ? day : `${day}, ${t(da)}–${t(db)}`;
}
function niceTicks(min, max, count = 4) {
  if (min === max) { const d = Math.abs(min) || 1; min -= d; max += d; }
  const raw = (max - min) / count;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const m = raw / p;
  const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { lo, hi, ticks };
}

/** Time axis, value grid and an optional strip under the plot (for sample sizes). */
function frame({ width, t0, t1, lo, hi, ticks, tickFmt, span, label, H = 210, strip = 0, vgrid = true }) {
  const W = Math.max(280, Math.floor(width));
  const padL = 44, padR = 10, padT = 10, padB = 22 + strip;
  const iw = W - padL - padR, ih = H - padT - padB;
  const x = (t) => padL + ((Math.max(t0, Math.min(t1, t)) - t0) / (t1 - t0 || 1)) * iw;
  const y = (v) => padT + ih - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo || 1)) * ih;
  const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': label });
  for (const v of ticks) {
    const yy = Math.round(y(v)) + 0.5;
    svg.append(s('line', { x1: padL, x2: W - padR, y1: yy, y2: yy, stroke: COLORS.grid }), s('text', { x: padL - 6, y: yy + 3.5, 'text-anchor': 'end', text: tickFmt(v) }));
  }
  const steps = [5 * 60000, 10 * 60000, 15 * 60000, 30 * 60000, HOUR, 2 * HOUR, 3 * HOUR, 6 * HOUR, 12 * HOUR, 24 * HOUR, 2 * 24 * HOUR, 7 * 24 * HOUR];
  // At most one time label per 80 px, so narrow screens do not crowd them.
  const maxLabels = Math.max(2, Math.min(6, Math.floor(iw / 80)));
  const step = steps.find((st) => (t1 - t0) / st <= maxLabels) ?? steps.at(-1);
  const offset = new Date().getTimezoneOffset() * 60000;
  for (let t = Math.ceil((t0 - offset) / step) * step + offset; t <= t1; t += step) {
    const xx = Math.round(x(t)) + 0.5;
    if (vgrid) svg.append(s('line', { x1: xx, x2: xx, y1: padT, y2: padT + ih + strip, stroke: COLORS.grid }));
    if (xx > padL + 28 && xx < W - padR - 28) svg.append(s('text', { x: xx, y: H - 6, 'text-anchor': 'middle', text: timeLabel(t, span) }));
  }
  return { svg, x, y, W, H, padL, padR, padT, iw, ih, stripTop: padT + ih + 4, strip };
}

function hover(f, marks, onPick, onIdle) {
  if (!marks.length) return;
  const ring = s('circle', { r: 6, fill: 'none', stroke: COLORS.marker, visibility: 'hidden' });
  const hit = s('rect', { x: f.padL, y: f.padT, width: f.iw, height: f.ih + f.strip, fill: 'transparent' });
  f.svg.append(ring, hit);
  const move = (e) => {
    const box = f.svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / (box.width || 1)) * f.W;
    let best = marks[0];
    for (const m of marks) if (Math.abs(m.cx - px) < Math.abs(best.cx - px)) best = m;
    ring.setAttribute('cx', best.cx);
    ring.setAttribute('cy', best.cy);
    ring.setAttribute('visibility', 'visible');
    onPick(best);
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', () => { ring.setAttribute('visibility', 'hidden'); onIdle(); });
}

/** One value per window: the index or return per 1, the smoothed hour, and sample sizes (the range shows on hover). */
function windowChart({ v, kind, width }) {
  const k = v.kinds[kind];
  const m = metric[kind];
  const isIndex = m !== 'money';
  const { spec, now, settled } = v;
  const span = spec.to - spec.from;
  const [, what] = NAMES[kind];
  const ixOf = (w) => (m === 'shown' ? w.shown : w.index);
  const pick = (w) => (isIndex ? { val: ixOf(w).index, ci: ixOf(w).ci, n: ixOf(w).n } : { val: w.money.ratio, ci: w.money.ci, n: w.money.n });
  const ref = m === 'index' ? k.avg.index : m === 'shown' ? k.shownAvg.index : k.money.ratio;
  const cap = isIndex ? 2.5 : 3;
  const vals = [1];
  if (ok(ref)) vals.push(ref);
  for (const w of k.windows) {
    const p = pick(w);
    if (ok(p.val) && p.n >= 20) vals.push(p.val);
    if (m === 'index' && ok(w.smooth)) vals.push(w.smooth);
  }
  const clipped = vals.filter(ok).map((q) => Math.max(0, Math.min(cap, q)));
  const { lo, hi, ticks } = niceTicks(Math.max(0, Math.min(...clipped) - 0.05), Math.max(...clipped) + 0.05, 4);
  const f = frame({ width, t0: spec.from, t1: now, lo, hi, ticks, tickFmt: (q) => fmt(q, q % 1 ? 2 : 1), span, strip: 30, H: 250, vgrid: false, label: `${NAMES[kind][0]}: ${metricName(kind, m)} per ${windowMin}-minute window over the last ${spec.label}.` });
  const { svg, x, y } = f;
  // Windows whose rows are still arriving: a flat band behind them.
  if (settled.at < now) {
    const sx = x(Math.max(spec.from, settled.at));
    svg.append(s('rect', { x: sx, y: f.padT, width: Math.max(0, x(now) - sx), height: f.ih, fill: COLORS.bar, 'fill-opacity': 0.45 }));
    if (x(now) - sx > 70) svg.append(s('text', { x: x(now) - 4, y: f.padT + 12, 'text-anchor': 'end', text: 'still arriving' }));
  }
  const yb = Math.round(y(1)) + 0.5;
  svg.append(s('line', { x1: f.padL, x2: f.W - f.padR, y1: yb, y2: yb, stroke: COLORS.diag, 'stroke-width': 1.25, 'stroke-dasharray': '5 4' }));
  if (ok(ref)) {
    const ya = Math.round(y(ref)) + 0.5;
    svg.append(s('line', { x1: f.padL, x2: f.W - f.padR, y1: ya, y2: ya, stroke: COLORS.warn, 'stroke-width': 1, 'stroke-opacity': 0.7 }));
  }
  // Sample size per window, as bars under the plot.
  const maxN = Math.max(1, ...k.windows.map((w) => pick(w).n));
  const bw = Math.max(1, f.iw / Math.max(1, k.windows.length) - 1);
  for (const w of k.windows) {
    const p = pick(w);
    if (!p.n) continue;
    const bh = Math.max(1, (p.n / maxN) * (f.strip - 8));
    svg.append(s('rect', { x: x(w.start), y: f.stripTop + (f.strip - 8 - bh), width: bw, height: bh, fill: COLORS.bar }));
  }
  const dense = k.windows.length > 160;
  const marks = [];
  for (const w of k.windows) {
    const p = pick(w);
    if (!ok(p.val) || !p.n) continue;
    const cx = x(w.start + spec.window / 2);
    const z = m === 'index' && !w.provisional ? w.z : null;
    const color = w.provisional ? COLORS.diag : z != null && z >= 2 ? COLORS.pos : z != null && z <= -2 ? COLORS.neg : COLORS.line;
    const solid = p.n >= 20 && !w.provisional;
    svg.append(s('circle', { cx, cy: y(p.val), r: dense ? 2 : 3, fill: solid ? color : COLORS.bg, stroke: color, 'stroke-width': 1.25 }));
    marks.push({ cx, cy: y(p.val), w, p });
  }
  if (m === 'index') {
    let d = '';
    for (const w of k.windows) {
      if (!ok(w.smooth) || w.provisional) { d += ' '; continue; }
      const px = x(w.start + spec.window / 2), py = y(w.smooth);
      d += `${d && !d.endsWith(' ') ? 'L' : 'M'}${px.toFixed(1)},${py.toFixed(1)}`;
    }
    svg.append(s('path', { d: d.trim(), fill: 'none', stroke: COLORS.marker, 'stroke-width': 1.5, 'stroke-opacity': 0.8, 'stroke-linejoin': 'round' }));
  }
  const readout = h('div', { class: 'readout' });
  const hasRows = k.windows.some((w) => w.n > 0);
  const empty = !hasRows ? 'No data in this range yet.' : kind === 'case' ? 'No hit index yet: it needs the case of each open, which the monitor sends from version 1.2.0 on. Switch to “return per 1” for older rows.' : 'No win index yet: these upgrades have no shown chance. Switch to “return per 1”.';
  const idle = () => readout.replaceChildren(h('span', { class: 'faint', text: marks.length ? 'Hover or tap a window for details.' : empty }));
  idle();
  hover(f, marks, ({ w }) => {
    const ix = w.index, sh = w.shown, mo = w.money;
    readout.replaceChildren(
      h('div', null, `${spanLabel(w.start, w.start + spec.window)}  `,
        h('span', { class: ['num', sign((ix.index ?? NaN) - 1)], text: `${kind === 'upgrade' ? 'vs normal' : 'hit index'} ${fmt2(ix.index)}` }),
        h('span', { class: 'faint', text: ix.ci ? ` (${fmt2(ix.ci[0])}–${fmt2(ix.ci[1])})` : '' }), '  ',
        kind === 'upgrade' ? h('span', { class: ['num', sign((sh.index ?? NaN) - 1)], text: `vs shown ${fmt2(sh.index)}  ` }) : null,
        h('span', { class: ['num', sign((mo.ratio ?? NaN) - 1)], text: `return ${fmt3(mo.ratio)}` }),
        w.provisional ? h('span', { class: 'warn-text', text: '  still arriving' }) : null),
      h('div', { class: 'faint', text: `${fmtInt(w.n)} ${what} from ${fmtInt(w.players)} players, ${fmtInt(w.up)} of them up${kind === 'upgrade' ? `; ${fmtInt(ix.obs)} wins where ${fmt(ix.exp, 1)} are normal and the shown chances predict ${fmt(sh.exp, 1)}` : `; ${fmtInt(ix.obs)} hits where ${fmt(ix.exp, 1)} were expected`}` }));
  }, idle);
  const legend = h('div', { class: 'legend' },
    h('span', null, h('i', { class: 'dot', style: `background:${COLORS.line}` }), metricName(kind, m)),
    m === 'index' ? h('span', null, h('i', { style: `background:${COLORS.marker}` }), `smoothed over ${Math.min(60, Math.round((spec.to - spec.from) / 4 / 60000))} min`) : null,
    h('span', null, h('i', { style: `background:${COLORS.warn}` }), 'range average'),
    h('span', null, h('i', { style: `background:${COLORS.diag}` }), m === 'index' ? (kind === 'upgrade' ? '1 = normal for these chances and session phases' : '1 = the case’s usual rate') : m === 'shown' ? '1 = as the shown chances say' : '1 = break-even'),
    m === 'index' ? h('span', null, h('i', { class: 'dot', style: `background:${COLORS.pos}` }), h('i', { class: 'dot', style: `background:${COLORS.neg};margin-left:-2px` }), 'clearly above / below average') : null,
    h('span', null, h('i', { style: `background:${COLORS.bar};height:8px` }), 'sample size; shaded: rows still arriving'));
  return h('div', { class: 'chart' }, legend, readout, svg);
}

function windowList(title, list, kind) {
  return h('div', null, h('h3', { text: title }),
    list.length
      ? h('table', null, h('tbody', null, list.map((w) => h('tr', null,
          h('td', { text: spanLabel(w.start, w.start + view.spec.window) }),
          h('td', { class: ['num', sign(w.index.index - 1)], text: fmt2(w.index.index) }),
          h('td', { class: 'num faint', text: `${fmtInt(w.index.n)} ${NAMES[kind][1]}` }),
          h('td', { class: 'num faint', title: 'Standard errors from the range average', text: `z ${signed1(w.z)}` })))))
      : h('p', { class: 'faint', text: 'Not enough windows with 10 or more rows yet.' }));
}

const signed1 = (v) => (ok(v) ? `${v >= 0 ? '+' : '−'}${fmt(Math.abs(v), 1)}` : DASH);
const chanceText = (v) => (v >= 10 ? fmtInt(v) : v >= 1 ? fmt(v, 1) : fmt(v, 2));

/** Settled windows beyond ±2 and ±3 standard errors, against what chance alone gives. */
function tailLine(t) {
  if (!t?.windows) return null;
  const side = (key, sym) => t.levels.map((l) => {
    const past = l[key] > Math.max(2, 2 * l.expected);
    return h('span', { class: past ? (key === 'low' ? 'neg' : 'pos') : null, text: `${l[key]} ${key === 'low' ? 'below' : 'above'} ${sym}${l.z}` });
  });
  const join = (parts) => parts.flatMap((p, i) => (i ? [', ', p] : [p]));
  const chance = t.levels.map((l) => `${chanceText(l.expected)} beyond ${l.z}`).join(', ');
  return h('p', { class: 'num', style: 'margin:10px 0 0' },
    `Of ${fmtInt(t.windows)} settled windows with 10 or more rows: `, ...join(side('low', '−')), '; ', ...join(side('high', '+')),
    `. Chance alone gives about ${chance} on each side.`);
}

/** Weekday x hour, colored by the index (or return) against 1, faded where the sample is small. */
function heatmap({ v, kind, width }) {
  const cells = v.heat[kind];
  const hours = v.hours[kind];
  const m = metric[kind];
  const val = (c) => (m !== 'money' ? c?.index?.index : c?.money?.ratio);
  const W = Math.max(300, Math.floor(width));
  const padL = 44, padT = 4, padB = 18;
  const cw = (W - padL - 4) / 24, ch = 20;
  const rows = [...cells.map((r, i) => ({ label: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][i], cells: r })), { label: 'All', cells: hours }];
  const H = padT + rows.length * (ch + 2) + 4 + padB;
  const svg = s('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': `${NAMES[kind][0]} by weekday and hour, local time.` });
  const marks = [];
  rows.forEach((row, ri) => {
    const yy = padT + ri * (ch + 2) + (ri === 7 ? 4 : 0);
    svg.append(s('text', { x: padL - 6, y: yy + ch / 2 + 4, 'text-anchor': 'end', text: row.label }));
    for (let hr = 0; hr < 24; hr++) {
      const c = row.cells[hr];
      const xx = padL + hr * cw;
      svg.append(s('rect', { x: xx, y: yy, width: cw - 2, height: ch, rx: 2, fill: '#1a1e23' }));
      const vv = val(c);
      if (ok(vv) && c.n) {
        const t = Math.max(-1, Math.min(1, (vv - 1) / 0.3));
        const conf = Math.min(1, (m !== 'money' ? c.index.n : c.money.n) / 60);
        svg.append(s('rect', { x: xx, y: yy, width: cw - 2, height: ch, rx: 2, fill: t >= 0 ? COLORS.pos : COLORS.neg, 'fill-opacity': (0.12 + 0.75 * Math.abs(t)) * (0.25 + 0.75 * conf) }));
      }
      marks.push({ x: xx, y: yy, c, label: `${row.label === 'All' ? 'All days' : row.label} ${String(hr).padStart(2, '0')}:00–${String(hr + 1).padStart(2, '0')}:00` });
    }
  });
  for (let hr = 0; hr < 24; hr += 3) svg.append(s('text', { x: padL + hr * cw + cw / 2, y: H - 4, 'text-anchor': 'middle', text: String(hr).padStart(2, '0') }));
  const readout = h('div', { class: 'readout' });
  const idle = () => readout.replaceChildren(h('span', { class: 'faint', text: 'Local time. Green: better than 1, red: worse; pale cells have few rows. Hover or tap a cell.' }));
  idle();
  const hit = s('rect', { x: padL, y: padT, width: W - padL, height: H - padT - padB, fill: 'transparent' });
  svg.append(hit);
  const move = (e) => {
    const box = svg.getBoundingClientRect();
    const px = ((e.clientX - box.left) / (box.width || 1)) * W;
    const py = ((e.clientY - box.top) / (box.height || 1)) * H;
    const hr = Math.max(0, Math.min(23, Math.floor((px - padL) / cw)));
    const ri = Math.max(0, Math.min(7, Math.floor((py - padT) / (ch + 2))));
    const mk = marks[ri * 24 + hr];
    const c = mk?.c;
    readout.replaceChildren(h('div', null, `${mk.label}  `,
      h('span', { class: ['num', sign((c?.index?.index ?? NaN) - 1)], text: `index ${fmt2(c?.index?.index)}` }), '  ',
      h('span', { class: ['num', sign((c?.money?.ratio ?? NaN) - 1)], text: `return ${fmt3(c?.money?.ratio)}` })),
      h('div', { class: 'faint', text: `${fmtInt(c?.n ?? 0)} ${NAMES[kind][1]}` }));
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerdown', move);
  hit.addEventListener('pointerleave', idle);
  return h('div', { class: 'chart' }, readout, svg);
}

/** Site-wide upgrades and case opens per minute. */
function activityChart({ v, width }) {
  const { spec, now } = v;
  const series = [['upgradesPerMin', 'Upgrades / min', COLORS.line], ['casesPerMin', 'Case opens / min', COLORS.warn]];
  const buckets = v.volume.buckets;
  const vals = [];
  for (const b of buckets) for (const [k] of series) if (ok(b[k])) vals.push(b[k]);
  const { lo, hi, ticks } = niceTicks(0, Math.max(10, ...vals), 4);
  const f = frame({ width, t0: spec.coarse.from, t1: now, lo, hi, ticks, tickFmt: (q) => (q >= 1000 ? `${fmt(q / 1000, q % 1000 ? 1 : 0)}k` : fmt(q)), span: spec.to - spec.from, label: `Site-wide upgrades and case opens per minute over the last ${spec.label}.`, H: 190 });
  const marks = [];
  for (const [k, , color] of series) {
    let d = '';
    for (const b of buckets) {
      if (!ok(b[k])) { d += ' '; continue; }
      const cx = f.x(b.bucket + spec.coarse.bucket / 2), cy = f.y(b[k]);
      d += `${d && !d.endsWith(' ') ? 'L' : 'M'}${cx.toFixed(1)},${cy.toFixed(1)}`;
      if (k === 'upgradesPerMin') marks.push({ cx, cy, b });
    }
    f.svg.append(s('path', { d: d.trim(), fill: 'none', stroke: color, 'stroke-width': 1.75, 'stroke-linejoin': 'round' }));
  }
  const readout = h('div', { class: 'readout' });
  const idle = () => readout.replaceChildren(h('span', { class: 'faint', text: marks.length ? 'From the site’s public counters. Hover or tap for details.' : 'No counter samples in this range yet.' }));
  idle();
  hover(f, marks, ({ b }) => readout.replaceChildren(`${spanLabel(b.bucket, b.bucket + spec.coarse.bucket)}: `,
    h('span', { class: 'num', text: `${fmtInt(b.upgradesPerMin)} upgrades / min, ${fmtInt(b.casesPerMin)} case opens / min, ${fmtInt(b.online)} online` })), idle);
  const legend = h('div', { class: 'legend' }, series.map(([, label, color]) => h('span', null, h('i', { style: `background:${color}` }), label)));
  return h('div', { class: 'chart' }, legend, readout, f.svg);
}

const durationText = (m) => (m === 60 ? 'hour' : `${m} minutes`);
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

/** The last 6 hours at a glance: the index over the compared length before each 5-minute step. */
function glanceLine({ kind, width }) {
  const g = view.glance[kind];
  const pts = g.points;
  const vals = [1];
  for (const p of pts) if (ok(p.index)) vals.push(p.index, ...(p.ci ?? []));
  const clipped = vals.filter(ok).map((q) => Math.max(0, Math.min(2.5, q)));
  const lo0 = Math.min(0.85, ...clipped), hi0 = Math.max(1.15, ...clipped);
  const { lo, hi, ticks } = niceTicks(Math.max(0, lo0 - 0.02), hi0 + 0.02, 4);
  const f = frame({ width, t0: g.from, t1: g.to, lo, hi, ticks, tickFmt: (q) => fmt(q, Math.round(q * 10) === q * 10 ? 1 : 2), span: g.to - g.from, H: 120, label: `${NAMES[kind][0]}: ${kind === 'upgrade' ? 'wins against normal' : 'hit index'} over the last 6 hours.` });
  const { svg, x, y } = f;
  const yb = Math.round(y(1)) + 0.5;
  svg.append(s('line', { x1: f.padL, x2: f.W - f.padR, y1: yb, y2: yb, stroke: COLORS.diag, 'stroke-width': 1.25, 'stroke-dasharray': '5 4' }));
  // 95% range as a flat band, the line on top: solid while settled, dashed while rows are still arriving.
  const runs = [];
  let run = [];
  for (const p of pts) {
    if (ok(p.index)) run.push(p);
    else if (run.length) { runs.push(run); run = []; }
  }
  if (run.length) runs.push(run);
  for (const r of runs) {
    const band = r.filter((p) => p.ci);
    if (band.length > 1) {
      const top = band.map((p) => `${x(p.t).toFixed(1)},${y(Math.min(hi, p.ci[1])).toFixed(1)}`);
      const bottom = band.slice().reverse().map((p) => `${x(p.t).toFixed(1)},${y(Math.max(lo, p.ci[0])).toFixed(1)}`);
      svg.append(s('polygon', { points: [...top, ...bottom].join(' '), fill: COLORS.line, 'fill-opacity': 0.12 }));
    }
    const path = (list) => list.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.index).toFixed(1)}`).join('');
    const solid = r.filter((p) => !p.provisional);
    const tail = r.filter((p, i) => p.provisional || (r[i + 1] && r[i + 1].provisional));
    if (solid.length > 1) svg.append(s('path', { d: path(solid), fill: 'none', stroke: COLORS.line, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
    if (tail.length > 1) svg.append(s('path', { d: path(tail), fill: 'none', stroke: COLORS.diag, 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }));
  }
  const last = pts.filter((p) => ok(p.index) && !p.provisional).at(-1);
  if (last) svg.append(s('circle', { cx: x(last.t), cy: y(last.index), r: 3.5, fill: COLORS.line }));
  const readout = h('div', { class: 'readout small' });
  const idle = () => readout.replaceChildren(h('span', { class: 'faint', text: runs.length ? `Each point: the ${durationText(view.compareMinutes)} before it. Dashed: rows still arriving.` : 'Not enough rows in the last 6 hours yet.' }));
  idle();
  const marks = pts.filter((p) => ok(p.index)).map((p) => ({ cx: x(p.t), cy: y(p.index), p }));
  hover(f, marks, ({ p }) => readout.replaceChildren(
    h('span', null, `${clock(p.t - view.compareMinutes * 60000)}–${clock(p.t)}  `),
    h('span', { class: ['num', sign(p.index - 1)], text: fmt2(p.index) }),
    h('span', { class: 'faint', text: `${p.ci ? ` (${fmt2(p.ci[0])}–${fmt2(p.ci[1])})` : ''}, ${fmtInt(p.n)} ${NAMES[kind][1]}${p.provisional ? ', still arriving' : ''}` })), idle);
  return h('div', { class: 'chart' }, svg, readout);
}

function glanceCard(kind, width) {
  const c = view.compare[kind];
  const mo = view.compareMoney[kind];
  const m = view.compareMinutes;
  const what = NAMES[kind][1];
  const lag = view.settled;
  const high = ok(c.z) && c.z > 0;
  // Describes the last window; green or red only when it is far outside what chance gives several times a day.
  const word = c.strength === 'few' ? 'Not enough data yet'
    : c.strength === 'noise' ? 'Within normal noise'
    : c.strength === 'mild' ? `Slightly ${high ? 'high' : 'low'}, often chance`
    : `Unusually ${high ? 'high' : 'low'}`;
  const cls = c.strength === 'strong' ? (high ? 'good' : 'bad') : '';
  const detail = c.strength === 'few'
    ? `Needs at least 30 ${what} in the ${durationText(m)} up to ${clock(c.to)}; there are ${fmtInt(c.n)}.`
    : `${kind === 'upgrade' ? 'Wins' : 'Hits'} at ${fmt2(c.index)} times the usual rate in the ${durationText(m)} up to ${clock(c.to)} (${fmtInt(c.n)} ${what}${c.ci ? `, 95% range ${fmt2(c.ci[0])}–${fmt2(c.ci[1])}` : ''}, z ${fmt(c.z, 1)}). ${
        c.strength === 'noise' ? 'Random swings this size happen all the time.' : c.strength === 'mild' ? 'Checked every 30 minutes, about 2 a day look like this by chance alone.' : 'Chance alone gives this about once a week.'}`;
  const before = c.before.verdict === 'few' ? '' : ` The ${m === 60 ? '3 hours' : `${3 * m} minutes`} before: ${fmt2(c.base.index)}.`;
  const p = view.persistence[kind][m];
  const predicts = p.verdict === 'few'
    ? `Not enough history yet to check whether a window like this says anything about the next one (${fmtInt(p.pairs)} of 20 pairs).`
    : p.verdict === 'none'
      ? `It does not predict the next ${durationText(m)}: over 7 days, consecutive windows were unrelated (correlation ${signed(p.r)}, range ${signed(p.ci[0])} to ${signed(p.ci[1])}).`
      : `Over 7 days a window like this ${p.verdict === 'carry' ? 'tended to be followed by a similar one' : 'tended to be followed by the opposite'} (correlation ${signed(p.r)}, range ${signed(p.ci[0])} to ${signed(p.ci[1])}).`;
  // A link of 0.3 or more is strong enough to read a direction from: the next window's expected z is r times this one's.
  // Green or red only when that direction is clear, i.e. this window is itself at least 1 z away from normal.
  const strong = (p.verdict === 'carry' || p.verdict === 'reverse') && Math.abs(p.r) >= STRONG_R;
  const nextZ = strong && ok(c.z) ? p.r * c.z : null;
  const lean = ok(nextZ) && Math.abs(c.z) >= 1 ? (nextZ > 0 ? 'up' : 'down') : null;
  const forecast = !strong ? ''
    : lean ? ` Strong link: expect the next ${durationText(m)} ${lean === 'up' ? 'above' : 'below'} normal (z about ${signed(nextZ)}).`
    : ' Strong link, but this window is close to normal, so the next one should be too.';
  return h('section', { class: cls },
    h('div', { class: 'glance-top' },
      h('div', null, h('div', { class: 'kind', text: `${NAMES[kind][0]}, last ${durationText(m)}` }), h('div', { class: 'headline', text: word })),
      h('div', { class: ['big', 'num', !ok(c.index) ? 'faint' : cls === 'good' ? 'pos' : cls === 'bad' ? 'neg' : ''] }, fmt2(c.index), h('small', { text: kind === 'upgrade' ? '× normal' : '× usual hits' }))),
    glanceLine({ kind, width }),
    h('div', { class: 'muted', text: detail + before }),
    completenessLine(kind, c.n, m),
    h('div', { class: ['predicts', lean === 'up' ? 'pos' : lean === 'down' ? 'neg' : p.verdict === 'carry' || p.verdict === 'reverse' ? 'warn-text' : 'muted'], text: predicts + forecast }),
    h('div', { class: 'hint', text: `Return per 1: ${fmt3(mo.recent.ratio)}, before ${fmt3(mo.base.ratio)}. Rows after ${clock(lag.at)} are still arriving (${!lag.known ? `assumed ${Math.round(lag.lagMs / 60000)} min until enough arrival times are measured` : lag.capped ? `80% take over 2 hours to arrive; windows count as complete after 2 hours` : `80% arrive within ${Math.round(lag.lagMs / 60000)} min`}). Rows so far compares this window with the earlier ones of the last 3 days at the same age: the rows they had then, against the rows they had 24 hours after they ended (12 hours until a day of such windows exists). Most rows come from reading newly found players' history, so this share swings a lot from hour to hour; early rows are not luckier or unluckier than late ones, but a low share means the reading can still move a lot.` }));
}

/** How complete the compared window probably is, from monitor_arrival (loaded after the rest of the page). */
function completenessLine(kind, n, m) {
  const c = arrivalCache.get(m);
  if (!c) return h('div', { class: 'faint', text: arrivalError ? `How complete this ${durationText(m)} is could not be loaded: ${arrivalError}` : `Measuring how complete this ${durationText(m)} is…` });
  const a = arrivalShare(c.data, kind, n);
  if (!a) return h('div', { class: 'faint', text: `How complete this ${durationText(m)} is: not measured yet (needs ${ARRIVAL_MIN_WINDOWS[12]} earlier windows whose 12 hours have passed).` });
  const spread = ok(a.p10) && ok(a.p90) ? `; single windows ranged ${pct(a.p10, 0)}–${pct(a.p90, 0)}` : '';

/** Each settled window against the next one, as z-scores: a round cloud means one says nothing about the other. */

async function loadCase() {

      h('td', { class: 'num faint', text: i.price >= o.price ? 'big drop' : '' })));
    out.push(h('h3', { class: 'muted small-text', style: 'margin:12px 0 4px;font-weight:600', text: `Published odds${w.latest?.ts ? `, read ${fmtAgo(Number(w.latest.ts))}` : ''}` }),

        o.known ? `, so the site keeps ${pct(1 - o.ret)}${ok(o.chanceSum) && Math.abs(o.chanceSum - 100) > 0.01 ? ` (the chances add up to ${fmt(o.chanceSum, 2)}%, not 100%)` : ''}.` : null,
        ok(w.latest?.opens) ? ` Opened ${fmtInt(w.latest.opens)} times in all.` : ''));

    out.push(h('h3', { class: 'muted small-text', style: 'margin:16px 0 4px;font-weight:600', text: `Real results while watched, last ${st.spec.label}` }),

        kpi('Big drops', fmt(w.hitsAdj, w.hitsAdj < 100 ? 1 : 0), `${fmtInt(w.hits)} seen; ${fmt(w.expected, 1)} expected`),
        kpi('Big-drop rate', w.rate != null ? pct(w.rate, 2) : DASH, w.rateCi ? `range ${pct(w.rateCi[0], 2)}–${pct(w.rateCi[1], 2)}, published ${pct(o.hitChance, 2)}` : null),
        kpi('Opens counted', fmtInt(w.opens), `${pct(w.coverage, 0)} of the drop line caught`),

        spec: st.spec, width, ref: o.ret,

/** Running return per 1 of one case, window by window, with each window's own return and its opens below. */
function caseChart({ r, spec, width, ref = null, detail = null }) {
  const ws = r.windows;
  const vals = [1, ...(ok(ref) ? [ref] : [])];
  for (const w of ws) for (const q of [w.cumRatio, w.ratio]) if (ok(q)) vals.push(Math.min(3, q));
  const { lo, hi, ticks } = niceTicks(Math.max(0, Math.min(0.5, ...vals) - 0.05), Math.max(1.5, ...vals) + 0.05, 4);
  const t0 = r.chartFrom, t1 = spec.to;
  const f = frame({ width, t0, t1, lo, hi, ticks, tickFmt: (q) => fmt(q, q % 1 ? 2 : 1), span: t1 - t0, strip: 30, H: 240, vgrid: false, label: `Return per 1 of ${r.slug} over the last ${spec.label}.` });
  const { svg, x, y } = f;
  const yb = Math.round(y(1)) + 0.5;
  svg.append(s('line', { x1: f.padL, x2: f.W - f.padR, y1: yb, y2: yb, stroke: COLORS.diag, 'stroke-width': 1.25, 'stroke-dasharray': '5 4' }));
  const maxN = Math.max(1, ...ws.map((w) => w.n));
  const bw = Math.max(1, ((x(t0 + spec.bucket) - x(t0)) * 0.7));
  const marks = [];
  for (const w of ws) {
    const bh = Math.max(1, (w.n / maxN) * (f.strip - 8));
    svg.append(s('rect', { x: x(w.start) + (x(w.end) - x(w.start) - bw) / 2, y: f.stripTop + (f.strip - 8 - bh), width: bw, height: bh, fill: COLORS.bar }));
    if (ok(w.ratio)) svg.append(s('circle', { cx: x(w.start + spec.bucket / 2), cy: y(Math.min(hi, w.ratio)), r: 2.5, fill: w.ratio >= 1 ? COLORS.pos : COLORS.neg, 'fill-opacity': 0.55 }));
  }
  if (ok(ref)) {
    const yr = Math.round(y(ref)) + 0.5;
    svg.append(s('line', { x1: f.padL, x2: f.W - f.padR, y1: yr, y2: yr, stroke: COLORS.warn, 'stroke-width': 1.25, 'stroke-dasharray': '2 3' }));
  }
  const pts = ws.filter((w) => ok(w.cumRatio));
  if (pts.length > 1) svg.append(s('path', { d: pts.map((w, i) => `${i ? 'L' : 'M'}${x(w.end).toFixed(1)},${y(w.cumRatio).toFixed(1)}`).join(''), fill: 'none', stroke: COLORS.line, 'stroke-width': 2, 'stroke-linejoin': 'round' }));
  if (pts.length) { const w = pts.at(-1); svg.append(s('circle', { cx: x(w.end), cy: y(w.cumRatio), r: 3.5, fill: COLORS.line })); }
  for (const w of pts) marks.push({ cx: x(w.end), cy: y(w.cumRatio), w });
  const readout = h('div', { class: 'readout' });
  const idle = () => readout.replaceChildren(h('span', { class: 'faint', text: 'Hover or tap a window for details.' }));
  idle();
  hover(f, marks, ({ w }) => readout.replaceChildren(`${spanLabel(w.start, w.end)}: `,
    h('span', { class: ['num', sign(w.ratio - 1)], text: fmt3(w.ratio) }),
    h('span', { class: 'faint', text: detail ? detail(w) : ` in this window (${fmtInt(w.n)} opens, ${fmtInt(w.players)} players). Running: ` }),
    h('span', { class: ['num', sign(w.cumRatio - 1)], text: fmt3(w.cumRatio) }),
    h('span', { class: 'faint', text: ` over ${fmtInt(w.cumN)} opens.` })), idle);
  const legend = h('div', { class: 'legend' },
    h('span', null, h('i', { style: `background:${COLORS.line}` }), 'return per 1 so far'),
    h('span', null, h('i', { class: 'dot', style: `background:${COLORS.pos};opacity:.55` }), h('i', { class: 'dot', style: `background:${COLORS.neg};opacity:.55;margin-left:-2px` }), 'each window'),
    h('span', null, h('i', { style: `background:${COLORS.diag}` }), '1 = players get back what they pay'),
    ok(ref) ? h('span', null, h('i', { style: `background:${COLORS.warn}` }), `published return (${fmt3(ref)})`) : null,
    h('span', null, h('i', { style: `background:${COLORS.bar};height:8px` }), 'opens'));
  return h('div', { class: 'chart' }, legend, readout, svg);
}

// ---- one player's openings: the monitor reads their case list on request ----
// What was asked last, kept in the browser: {id, slug, link}. The read's status comes from the database.
let playerAsk = (() => { try { return JSON.parse(store.get('pulse.case.player', 'null')); } catch { return null; } })();
let playerFetch = null; // monitor_player_fetch_status answer
let playerError = null;
let playerCase = null; // {key, slug, spec, report, others}
let playerPoll = null;
const playerInputEl = h('input', { type: 'text', placeholder: 'https://caser.gg/en/profile/…', 'aria-label': 'Player profile link or id', autocomplete: 'off', spellcheck: 'false' });
playerInputEl.value = playerAsk?.link ?? '';

async function askPlayer() {
  playerError = null;
  const pid = playerIdFrom(playerInputEl.value);
  const slug = caseState?.slug ?? caseSlugFrom(caseInputEl.value);
  if (!pid) playerError = 'That is not a player profile link or id. Paste a link like https://caser.gg/en/profile/824180.';
  else if (!slug) playerError = 'Look up a case first: the player’s openings are shown for that case.';
  if (playerError) { renderDashboard(); return; }
  try {
    const id = await rpc('monitor_player_fetch_request', { player_id: pid, case_slug: slug });
    playerAsk = { id: Number(id), slug, link: playerInputEl.value.trim() };
    store.set('pulse.case.player', JSON.stringify(playerAsk));
    playerFetch = null;
    playerCase = null;
    pollPlayer();
  } catch (e) {
    playerError = e.message || String(e);
    renderDashboard();
  }
}
async function pollPlayer() {
  clearTimeout(playerPoll);
  playerPoll = null;
  if (!playerAsk?.id) return;
  try {
    playerFetch = await rpc('monitor_player_fetch_status', { fetch_id: playerAsk.id });
  } catch (e) {
    playerError = e.message || String(e);
  }
  const f = playerFetch;

/** The drop line's colour mix per window: one line per colour (its share of the drops seen), with the drop rate under it. */
function feedChart({ spec, now, windows: fw, width }) {

  const tiers = FEED_TIERS.filter(([k]) => !feedHidden.has(k));
  const full = (w) => w.seen >= FEED_MIN_SEEN;
  const share = (w, k) => w.counts[k] / w.seen;
  let top = 0.1;
  for (const w of fw) if (full(w)) for (const [k] of tiers) top = Math.max(top, share(w, k));

  for (const w of fw) {
    if (!w.perMin || w.start + spec.window <= t0) continue;
    const bh = Math.max(1, (w.perMin / maxRate) * (f.strip - 8));
    svg.append(s('rect', { x: x(w.start), y: f.stripTop + (f.strip - 8 - bh), width: bw, height: bh, fill: COLORS.bar }));
  }
  // One line per colour; windows with too few drops break the line instead of adding noise.
  const drawn = fw.filter((w) => full(w) && w.start + spec.window > t0).length;
  const dots = drawn <= 90;
  // Many windows: thinner lines, so the colours stay apart instead of merging into one band.

  hover(f, marks, ({ w }) => {
    readout.replaceChildren(
      h('div', null, `${spanLabel(w.start, w.start + spec.window)}  `,
        h('span', { class: 'num', text: `${fmtInt(w.seen)} drops seen` }),
        h('span', { class: 'faint', text: w.span ? ` of ${fmtInt(w.span)} shown (${pct(Math.min(1, w.seen / w.span), 0)})` : '' }),
        h('span', { class: 'num', text: ok(w.perMin) ? ` · ${fmt(w.perMin, 1)} drops a minute` : '' }),
        h('span', { class: 'num', text: ` · purple and below ${pct(w.low, 0)}` })),
      h('div', { class: 'faint num', text: FEED_TIERS.filter(([k]) => w.counts[k]).map(([k, , name]) => `${name.split(' (')[0]} ${w.counts[k]} (${pct(share(w, k), 0)})`).join(' · ') + (full(w) ? '' : `  · under ${FEED_MIN_SEEN} drops, not drawn`) }));
  }, idle);
  return h('div', null,
    h('div', { class: 'legend' }, FEED_TIERS.map(([k, color, name]) => h('button', { type: 'button', class: 'legend-item', 'aria-pressed': String(!feedHidden.has(k)), title: feedHidden.has(k) ? 'Show this colour' : 'Hide this colour', style: feedHidden.has(k) ? 'opacity:0.4' : '', onclick: () => toggleFeedTier(k) }, h('i', { style: `background:${color}` }), name)),
      h('span', null, h('i', { style: `background:${COLORS.bar};height:8px` }), 'drops per minute')),
    readout, h('div', { class: 'chart' }, f.svg));
}

function feedSection({ v, width }) {
  const c = v.feed.check;
  const names = ['Fewest cheap colours', 'Middle', 'Most cheap colours'];
  const anyRows = c.upgrade[0].windows + c.case[0].windows > 0;
  const rows = [0, 1, 2].map((i) => {
    const t = c.upgrade[0].windows ? c.upgrade[0].thirds[i] : c.case[0].thirds[i];
    return h('tr', null,
      h('td', null, names[i], h('span', { class: 'ci', text: t.windows ? `${pct(t.from, 0)}–${pct(t.to, 0)} purple and below, ${t.windows} windows` : '' })),
      ixCell(c.upgrade[0].thirds[i].index), ixCell(c.upgrade[1].thirds[i].index), ixCell(c.case[0].thirds[i].index), ixCell(c.case[1].thirds[i].index));
  });
  const zCell = (x) => h('td', { class: ['num', !ok(x.z) ? 'faint' : Math.abs(x.z) >= 2 ? (x.z < 0 ? 'neg' : 'pos') : 'faint'], text: ok(x.z) ? `${x.z > 0 ? '+' : ''}${fmt(x.z, 1)}` : DASH });
  const own = feedRangeKey !== 'same';
  const fv = own ? feedView : { spec: v.spec, now: v.now, windows: v.feed.windows };
  const winMin = own ? feedWin : windowMin;
  const chart = fv && (!own || (fv.spec.key === feedRangeKey && fv.spec.window === feedWin * 60000)) ? feedChart({ ...fv, width })
    : h('p', { class: 'faint', style: 'min-height:200px', text: feedError ? `Could not load the drop line: ${feedError}` : 'Loading…' });
  return h('section', null,
    h('div', { class: 'sec-head' },
      h('h2', { text: `Drop line colours per ${winLabel(winMin)} window, last ${own ? RANGES[feedRangeKey].label : v.spec.label}` }),
      h('div', { class: 'row', style: 'gap:6px 12px' },
        toggle([['same', 'Top', 'Use the range and window picked at the top'], ...FEED_RANGE_KEYS.map((k) => [k, k, `Last ${RANGES[k].label}`])], feedRangeKey, setFeedRange, 'Range'),
        own ? toggle(feedWindowsFor(feedRangeKey).map((m) => [m, m >= 60 ? `${m / 60}h` : `${m}m`, `${m}-minute windows`]), feedWin, setFeedWin, 'Window') : windowToggle())),
    chart,
    h('h3', { class: 'muted small-text', style: 'margin:14px 0 4px;font-weight:600', text: `Do cheap colours go with worse results? Last ${v.spec.label}, ${winLabel(windowMin)} windows (the range at the top)` }),
    anyRows
      ? tableOf(['Windows by share of purple and below', 'Upgrades, same window', 'Upgrades, next window', 'Cases, same window', 'Cases, next window'], [
          ...rows,
          h('tr', null, h('td', { class: 'faint', text: 'Most against fewest, in standard errors' }), zCell(c.upgrade[0]), zCell(c.upgrade[1]), zCell(c.case[0]), zCell(c.case[1])),
        ])
      : h('p', { class: 'faint', text: `Not enough settled windows with ${FEED_MIN_SEEN} or more drops seen yet.` }),
    h('p', { class: 'hint', text: `The chart can have its own range, so short windows work over days too; “Top” follows the range at the top of the page. Each line is one colour: its share of the drops the monitor saw in each window, as the site draws them (gold: knives, gloves and the Howl; purple also holds every sticker). Click a colour in the legend to hide or show its line. Shares, not counts, so a busy hour does not look different just for being busy; the drop rate is the grey strip under it. The line shows only big wins. The monitor reads its newest 20 every 30 to 90 seconds; the site numbers its drops, so the rate is exact even when a read misses some. Windows with under ${FEED_MIN_SEEN} drops seen leave a gap in the lines. The table splits the settled windows of this range into thirds by their share of purple and below, with wins against normal (upgrades) and the hit index (cases) for each third. “Same window” is partly circular: the line is made of the wins, so a window where players win less shows fewer top colours. “Next window” is the real test: whether the mix you see now says anything about the minutes after it. A difference under 2 standard errors is likely chance; use a long range for enough windows.` }));
}

function renderLogin(message) {
  const email = h('input', { type: 'email', id: 'email', autocomplete: 'username', required: true });
  const password = h('input', { type: 'password', id: 'password', autocomplete: 'current-password', required: true });
  const err = h('p', { class: 'error', role: 'alert', text: message || '' });
  const submit = h('button', { type: 'submit', class: 'primary', text: 'Sign in' });
  const form = h('form', { onsubmit: async (e) => {
    e.preventDefault();
    submit.disabled = true;
    err.textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
    submit.disabled = false;
    if (error) err.textContent = error.message;
  } }, h('label', { for: 'email', text: 'Email' }), email, h('label', { for: 'password', text: 'Password' }), password, submit, err);
  root.replaceChildren(h('section', { class: 'login' }, h('h1', { text: 'Pulse monitor' }), h('p', { class: 'muted', text: 'Sign in to see the data.' }), form));
  email.focus();
}

function renderNotViewer() {
  const id = session.user.id;
  root.replaceChildren(header(), h('section', null,
    h('h2', { text: 'This account cannot read the monitor data' }),
    h('p', { class: 'muted', text: `Signed in as ${session.user.email}. Add the account as a viewer in Supabase (SQL editor):` }),
    h('pre', { class: 'num', style: 'white-space:pre-wrap;color:var(--text)', text: `insert into public.monitor_viewers (user_id) values ('${id}');` })));
}

// The database has a small, shared CPU: reads sent all at once slow each other past its 8 s statement timeout.
// At most RPC_SLOTS run at a time, and a read cancelled by the timeout is tried once more.
const RPC_SLOTS = 3;
let rpcBusy = 0;
const rpcQueue = [];
async function rpcOnce(name, args) {
  if (rpcBusy >= RPC_SLOTS) await new Promise((go) => rpcQueue.push(go));
  rpcBusy++;
  try {
    const { data, error } = await sb.rpc(name, args);
    if (error) throw error;
    return data ?? [];
  } finally {
    rpcBusy--;
    rpcQueue.shift()?.();
  }
}
const isTimeout = (e) => e?.code === '57014' || /statement timeout/i.test(e?.message ?? '');
async function rpcRetry(name, args) {
  try {
    return await rpcOnce(name, args);
  } catch (e) {
    if (!isTimeout(e)) throw e;
    return rpcOnce(name, args);
  }
}
const rpc = (name, args) => track(rpcRetry(name, args));

/**
 * The heavy reports come from the database's cache (monitor_cached), which a cron job refreshes every minute for
 * the reports asked for in the last 15 minutes, so they answer in milliseconds. roll and lead say how `to_ms`
 * moves with time (to_ms = floor(now / roll) * roll + lead), so the job can compute the next window ahead of
 * time. A report not cached yet and too slow to compute at once comes back as {pending: true}: the job computes
 * it within a minute, so ask again a little later.
 */
async function cached(name, args, roll, lead) {
  for (let i = 0; ; i++) {
    const data = await rpc('monitor_cached', { name, args, roll_ms: roll, lead_ms: lead });
    if (!data?.pending) return data;
    if (i >= 4) throw new Error('This view is still being prepared. It should appear within a minute.');
    await track(new Promise((go) => setTimeout(go, 15000)));
  }
}
let viewerChecked = null; // the user id monitor_is_viewer said yes to

async function load() {
  if (!session || loading) return;
  loading = true;
  if (view) renderDashboard();
  try {
    if (viewerChecked !== session.user.id) {
      const isViewer = await rpc('monitor_is_viewer', {});
      if (!isViewer) { loading = false; renderNotViewer(); return; }
      viewerChecked = session.user.id;
    }
    const now = Date.now();
    const spec = rangeSpec(rangeKey, now, windowMin);
    const cs = compareSpec(now, compareMin);
    const tz = -new Date().getTimezoneOffset();
    // The heat map always covers at least 7 days; for shorter ranges it comes from its own report.
    const needHeat = spec.to - spec.from < 7 * 24 * HOUR;
    const weekFresh = weekCache && now - weekCache.at < 10 * 60 * 1000 && weekCache.tz === tz;
    const weekTo = Math.floor(now / HOUR) * HOUR + HOUR;
    const pc = predictCache.get(predictMin);
    const predictFresh = pc && now - pc.at < 10 * 60 * 1000;
    // Only the range's own report is needed to draw the page; the others fill their sections when they come.
    let partial = null;
    const optional = (p) => p.catch((e) => { partial = e.message || String(e); return null; });
    const [report, cmp, volume, statusRes, eventsRes, weekNew, predictNew, feed, ownFeed] = await Promise.all([
      cached('monitor_report', { from_ms: spec.from, to_ms: spec.to, bucket_ms: spec.window, tz_offset_min: tz }, spec.window, spec.window),
      optional(cached('monitor_report', { from_ms: cs.from, to_ms: cs.to, bucket_ms: cs.bucket, tz_offset_min: tz }, cs.bucket, cs.bucket)),
      rpc('monitor_volume_agg', { from_ms: spec.coarse.from, to_ms: spec.coarse.to, bucket_ms: spec.coarse.bucket }).catch(() => []),
      track(sb.from('monitor_status').select('updated_at,status').maybeSingle()),
      track(sb.from('monitor_events').select('at,level,code,message').order('at', { ascending: false }).limit(30)),
      weekFresh ? Promise.resolve(null) : optional(cached('monitor_report', { from_ms: weekTo - 7 * 24 * HOUR, to_ms: weekTo, bucket_ms: 30 * 60 * 1000, tz_offset_min: tz }, HOUR, HOUR)),
      predictFresh ? Promise.resolve(null) : optional(cached('monitor_window_sums', { from_ms: weekTo - 7 * 24 * HOUR, to_ms: weekTo, bucket_ms: predictMin * 60 * 1000 }, HOUR, HOUR)),
      // The drop-line colours are an extra: the rest of the page works without them.
      rpc('monitor_feed_agg', { from_ms: spec.from, to_ms: spec.to, bucket_ms: spec.window }).catch(() => []),
      fetchFeed(now).catch((e) => { feedError = e.message || String(e); return null; }),
    ]);
    if (ownFeed) { feedView = ownFeed; feedError = null; }
    if (statusRes.error) throw statusRes.error;
    if (weekNew) weekCache = { at: now, tz, report: weekNew };
    if (predictNew) predictCache.set(predictMin, { at: now, rows: predictNew });
    const predict = predictCache.get(predictMin) ? { minutes: predictMin, rows: predictCache.get(predictMin).rows } : null;
    view = buildReport({ report, cmp, week: weekCache?.report ?? null, predict, heatReport: needHeat ? weekCache?.report ?? null : null, compareMinutes: compareMin, volume, feed, spec, now });
    health = { ...monitorHealth(statusRes.data, now), status: statusRes.data?.status ?? null };
    events = eventsRes.error ? [] : eventsRes.data ?? [];
    loadError = partial ? `part of the page did not load (${partial}); it is tried again in a minute` : null;
    sync.lastAt = Date.now();
  } catch (e) {
    loadError = e.message || String(e);
    sync.failedAt = Date.now();
  }
  paintSync();
  loading = false;
  renderDashboard();
  if (view) { loadShared(); loadArrival(); }
}

/** How complete the "Right now" window usually is at its age; loads on its own, the card says so meanwhile. */
let arrivalLoading = false;
async function loadArrival() {
  const m = view.compareMinutes;
  const c = arrivalCache.get(m);
  if (arrivalLoading || (c && Date.now() - c.at < 10 * 60 * 1000)) return;
  arrivalLoading = true;
  try {
    const args = { to_ms: view.settled.at, window_ms: m * 60000, age_ms: Math.max(0, view.now - view.settled.at) };
    arrivalCache.set(m, { at: Date.now(), data: await rpc('monitor_arrival', args) });
    arrivalError = null;
  } catch (e) {
    arrivalError = e.message || String(e);
  }
  arrivalLoading = false;
  if (tab === 'now') renderDashboard();
  if (view.compareMinutes !== m) loadArrival();
}

/** The site-shift check reads up to 30 days, so it loads on its own and does not hold up the rest of the page. */
let sharedLoading = false;
async function loadShared() {
  const key = `${sharedDays}/${sharedMin}`;
  const c = sharedCache.get(key);
  if (sharedLoading || (c && Date.now() - c.at < 10 * 60 * 1000)) return;
  sharedLoading = true;
  try {
    const now = Date.now();
    const to = Math.floor(now / (30 * 60000)) * 30 * 60000;
    const args = { from_ms: to - sharedDays * 24 * HOUR, to_ms: to, bucket_ms: sharedMin * 60000 };
    // A first read of 30 days can take several seconds while the database loads the synced history from disk;
    // rpc() tries a timed-out read once more, and the second try finds it in memory.
    const data = await cached('monitor_shared', args, 30 * 60000, 0);
    sharedCache.set(key, { at: now, data });
    sharedError = null;
  } catch (e) {
    sharedError = e.message || String(e);
  }
  sharedLoading = false;
  if (tab === 'now') renderDashboard();
  // A toggle pressed while this was loading asks for another key.
  if (`${sharedDays}/${sharedMin}` !== key) loadShared();
}
function setSharedMin(m) {
  sharedMin = SHARED_WINDOWS.includes(Number(m)) ? Number(m) : 60;
  store.set('pulse.shared.win', String(sharedMin));
  sharedError = null;
  renderDashboard();
  loadShared();
}
function setSharedDays(d) {
  sharedDays = SHARED_DAYS.includes(Number(d)) ? Number(d) : 30;
  store.set('pulse.shared.days', String(sharedDays));
  sharedError = null;
  renderDashboard();
  loadShared();
}

function setRange(k) {
  rangeKey = k;
  store.set('pulse.range', k);
  windowMin = pickWindow(rangeKey, store.get(`pulse.window.${k}`));
  view = null;
  load();
}
function setWindow(m) {
  windowMin = pickWindow(rangeKey, m);
  store.set(`pulse.window.${rangeKey}`, String(windowMin));
  view = null;
  load();
}
function setPredict(m) {
  predictMin = PREDICT_WINDOWS.includes(Number(m)) ? Number(m) : 10;
  store.set('pulse.predict', String(predictMin));
  load();
}
function setCompare(m) {
  compareMin = Number(m) === 60 ? 60 : 30;
  store.set('pulse.compare', String(compareMin));
  load();
}

sb.auth.onAuthStateChange((_event, s2) => {
  const was = session?.user?.id;
  session = s2;
  if (!session) { view = null; health = null; renderLogin(); return; }
  if (session.user.id !== was) { view = null; renderDashboard(); setTimeout(load, 0); }
});
sync.nextAt = Date.now() + 60000;
setInterval(() => { sync.nextAt = Date.now() + 60000; if (session && !document.hidden) load(); }, 60000);
let resizeTimer = null;
addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (session && view) renderDashboard(); }, 150); });
</script>
</body>
