<!doctype html>
<!--
  UI preview for src/ui without the real site.
  Uses an inline stub of the stats API (v1 + v2 functions) and ~2500 fake events
  (cases, normal and mystery upgrades, super-drop cards, deposits, withdrawals).
  The stub is a rough stand-in for testing the UI only; docs/integration.html uses the real src/stats.

  Browsers block ES module imports from file:// pages, so serve the project root over HTTP:
    npx http-server . -p 8080 -c-1
  or, without npm:
    node -e "const h=require('http'),f=require('fs'),p=require('path');h.createServer((q,r)=>{const x=p.join(process.cwd(),decodeURIComponent(q.url.split('?')[0]));f.readFile(x,(e,d)=>{r.writeHead(e?404:200,{'content-type':x.endsWith('.js')?'text/javascript':'text/html; charset=utf-8'});r.end(d)})}).listen(8080,'127.0.0.1')"
  then open http://localhost:8080/docs/ui-preview.html
  Add ?stats=real to run the same fake events through the real src/stats instead of the stub.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI preview</title>
<style>

  main { max-width: 720px; padding: 24px 16px 120px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #e6e8eb; }
  p { margin: 0 0 16px; color: #8d949e; }
  fieldset { border: 1px solid #272c34; border-radius: 8px; padding: 12px 14px; margin: 0 0 16px; }
  legend { padding: 0 6px; color: #8d949e; }
  label { display: inline-flex; gap: 6px; align-items: center; margin: 4px 14px 4px 0; }
  input[type=number] { width: 110px; background: #161a1f; color: #e6e8eb; border: 1px solid #363c46; border-radius: 6px; padding: 5px 8px; }
  button { background: #1d2128; color: #e6e8eb; border: 1px solid #363c46; border-radius: 6px; padding: 6px 12px; margin: 4px 6px 4px 0; cursor: pointer; }
  /* Hostile site CSS: must not leak into the shadow roots. */
  button, table, td, th, h3, p, div { letter-spacing: 0.3em !important; }
  * { font-family: "Comic Sans MS", cursive; }
</style>
</head>
<body>
<main>
  <h1>caser-stat-tracker UI preview</h1>
  <p>Launcher is bottom-left. The upgrade card shows while "Selection active" is checked. Page CSS here is deliberately hostile (letter-spacing, Comic Sans) to prove the shadow roots isolate styles.</p>
  <fieldset>
    <legend>Upgrade selection</legend>
    <label><input type="checkbox" id="selOn" checked> Selection active</label>
    <label>Stake <input type="number" id="stake" value="250" min="0" step="1"></label>
    <label>Target price <input type="number" id="target" value="1200" min="0" step="1"></label>
  </fieldset>
  <fieldset>
    <legend>Data</legend>
    <button id="addEv" type="button">Add a live event</button>
    <button id="loadFull" type="button">Load fake events</button>
    <button id="loadEmpty" type="button">Load no events</button>
  </fieldset>
</main>

    return buckets(events.filter((e) => testable(e)), edges, (e) => e.chanceShown).map((b) => {
      const m = moneyMetrics(b.rows);
      const shownRtp = b.rows.length ? sum(b.rows.map((e) => (e.chanceShown / 100) * e.target.price / e.stake)) / b.rows.length : null;
      return { label: b.label, lo: b.lo, hi: b.hi, n: m.n, shownRtp, realRtp: m.cost ? m.returned / m.cost : null, realRtpCI: m.roiCI ? [m.roiCI[0] + 1, m.roiCI[1] + 1] : null, mode: 'normal' };
    });
  },
  superDropStats(events) {
    const all = events.filter(isNormal), shown = all.filter(sdShown), notShown = all.filter((e) => !sdShown(e));
    const side = (l) => { const w = winStats(l), m = moneyMetrics(l); return { n: l.length, wins: w.wins, winRate: w.winRate, expectedRate: w.expectedRate, z: w.z, p: w.p, rtp: m.cost ? m.returned / m.cost : null }; };
    const hits = all.filter((e) => e.superDrop && e.superDrop.won).map((e) => e.returned / e.target.price);
    return { n: all.length, shownN: shown.length, shownRate: all.length ? shown.length / all.length : null, shown: side(shown), notShown: side(notShown),
      hits: { n: hits.length, avgMultiplier: hits.length ? sum(hits) / hits.length : null, minMultiplier: hits.length ? Math.min(...hits) : null, maxMultiplier: hits.length ? Math.max(...hits) : null } };
  },
  mysteryStats(events, stakeEdges = [0, 100, 500, 1000, 3000, Infinity]) {
    const list = events.filter((e) => isUp(e) && e.mystery);
    const mult = (e) => e.returned / e.stake;
    const m = moneyMetrics(list);
    const hits = list.filter((e) => mult(e) >= 1).length;
    const ms = list.map(mult).sort((a, b) => a - b);
    const binEdges = [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 3, Infinity];
    const histogram = buckets(list, binEdges, mult).map((b) => ({ label: b.label, lo: b.lo, hi: b.hi, n: b.rows.length }));
    const byStake = buckets(list, stakeEdges, (e) => e.stake).map((b) => ({ ...moneyMetrics(b.rows), lo: b.lo, hi: b.hi, label: b.label,
      hitRate: b.rows.length ? b.rows.filter((e) => mult(e) >= 1).length / b.rows.length : null, meanMultiplier: b.rows.length ? sum(b.rows.map(mult)) / b.rows.length : null }));
    // One-way ANOVA on per-event multiplier (F approximated through chi-square for the stub).
    const groups = byStake.filter((r) => r.n > 1);
    const grand = ms.length ? sum(ms) / ms.length : 0;
    const ssb = sum(groups.map((r) => r.n * (r.meanMultiplier - grand) ** 2));
    const ssw = sum(list.map((e) => { const r = byStake.find((g) => e.stake >= g.lo && e.stake < g.hi); return (mult(e) - (r ? r.meanMultiplier : grand)) ** 2; }));
    const df1 = groups.length - 1, df2 = list.length - groups.length;
    const F = df1 > 0 && df2 > 0 && ssw > 0 ? (ssb / df1) / (ssw / df2) : NaN;
    return { ...m, hitRate: list.length ? hits / list.length : null, hitRateCI: wilson(hits, list.length), meanMultiplier: ms.length ? grand : null,
      medianMultiplier: ms.length ? ms[Math.floor(ms.length / 2)] : null, histogram, byStake,
      test: { method: 'ANOVA', statistic: F, df: [df1, df2], p: Number.isFinite(F) ? chiSf(F * df1, df1) : NaN } };
  },
  moneyFlow(events, { balance = null, inventoryValue = null } = {}) {
    const deps = events.filter((e) => e.kind === 'deposit'), ok = deps.filter((e) => e.status === 'completed'), failed = deps.filter((e) => e.status !== 'completed');
    const wds = events.filter((e) => e.kind === 'withdrawal');
    const holdings = balance === null && inventoryValue === null ? null : (balance || 0) + (inventoryValue || 0);
    const depSum = sum(ok.map((e) => e.amount)), wdSum = sum(wds.map((e) => e.value));
    const firstTs = ok.length ? Math.min(...ok.map((e) => e.ts)) : null, lastTs = ok.length ? Math.max(...ok.map((e) => e.ts)) : null;
    let run = 0;
    const series = [...ok, ...wds].sort((a, b) => a.ts - b.ts).map((e) => {
      const isW = e.kind === 'withdrawal', amount = isW ? e.value : e.amount;
      run += isW ? amount : -amount;
      return { ts: e.ts, kind: e.kind, amount, cumulativeNet: run };
    });
    const dayOf = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
    const days = new Map();
    for (const p of series) { const k = dayOf(p.ts); if (!days.has(k)) days.set(k, { day: k, deposited: 0, withdrawn: 0 }); days.get(k)[p.kind === 'withdrawal' ? 'withdrawn' : 'deposited'] += p.amount; }
    return {
      deposits: { n: ok.length, sum: depSum, failedN: failed.length, failedSum: sum(failed.map((e) => e.amount)), firstTs, lastTs, perDay: firstTs ? depSum / Math.max(1, (lastTs - firstTs) / 864e5) : null },
      withdrawals: { n: wds.length, value: wdSum, exactTimeN: wds.filter((e) => e.exactTime).length },
      holdings, net: wdSum + (holdings ?? 0) - depSum, series, daily: [...days.values()].sort((a, b) => (a.day < b.day ? -1 : 1)),
    };
  },
  upgradeQuote({ stake, targetPrice, chanceShown }, events) {
    const cs = chanceShown ?? Math.min(100, (stake / targetPrice) * 103);
    const ev = (cs / 100) * targetPrice - stake;
    const bi = DEF_CHANCE.findIndex((x, i) => cs >= x && cs < (DEF_CHANCE[i + 1] ?? Infinity));
    const lo = DEF_CHANCE[bi], hi = DEF_CHANCE[bi + 1] ?? 100;
    const sb = DEF_STAKE.findIndex((x, i) => stake >= x && stake < DEF_STAKE[i + 1]);
    const inBucket = events.filter((e) => testable(e) && e.chanceShown >= lo && e.chanceShown < hi);
    const sim = inBucket.filter((e) => e.stake >= DEF_STAKE[sb] && e.stake < DEF_STAKE[sb + 1]);
    const ret = sum(inBucket.map((e) => e.returned)), cost = sum(inBucket.map((e) => e.stake));
    const p = cs / 100, N = 100;
    const lf = [0]; for (let i = 1; i <= N; i++) lf[i] = lf[i - 1] + Math.log(i);
    const pmf = [];
    for (let k = 0; k <= N; k++) pmf.push(p >= 1 ? (k === N ? 1 : 0) : p <= 0 ? (k === 0 ? 1 : 0) : Math.exp(lf[N] - lf[k] - lf[N - k] + k * Math.log(p) + (N - k) * Math.log(1 - p)));
    const netK = (k) => k * targetPrice - N * stake;
    let acc = 0, p05 = null, p95 = null, prof = 0;
    pmf.forEach((q, k) => { acc += q; if (p05 === null && acc >= 0.05) p05 = netK(k); if (p95 === null && acc >= 0.95) p95 = netK(k); if (netK(k) > 0) prof += q; });
    const wins = sim.filter((e) => e.won).length;
    return {
      chanceShown: cs, chanceFair: (stake / targetPrice) * 100, multiplier: targetPrice / stake, ev, evPct: ev / stake,
      realEdge: inBucket.length >= 30 ? ret / cost - 1 : null,
      similar: { n: sim.length, wins, winRate: sim.length ? wins / sim.length : null, winRateCI: wilson(wins, sim.length) },
      longRun: { tries: N, mean: N * ev, p05, p95, probProfit: prof },
    };
  },
};

  onExport: (format) => console.log('[preview] export', format),
  onImportFile: async () => { await new Promise((r) => setTimeout(r, 400)); return { added: 0 }; },
  onImportHistory: async () => { await new Promise((r) => setTimeout(r, 900)); const more = makeEvents(12, Date.now() - 864e5).map((e) => ({ ...e, id: 'h' + e.id + Date.now(), source: 'import' })); EVENTS.push(...more); return { added: more.length }; },
  onClear: async () => { EVENTS = []; },
  getStatus: () => ({ capturing: true, lastEventTs: EVENTS.length ? Math.max(...EVENTS.map((e) => e.ts)) : null, unknownResponses: 2, version: '0.2.0-preview' }),
  getHoldings: () => ({ balance: 1240.5, inventoryValue: 3810 }),

const overlay = mountUpgradeOverlay({
  getSelection: () => ($('selOn').checked ? { stake: Number($('stake').value), targetPrice: Number($('target').value), chanceShown: null } : null),
  getEvents: async () => EVENTS.slice(),
  stats: STATS,
  currency: () => '₽',

const refreshAll = () => { dash.refresh(); overlay.refresh(); };
$('addEv').onclick = () => { const e = makeEvents(1, Date.now())[0]; e.ts = Date.now(); e.id = 'live' + Date.now(); EVENTS.push(e); refreshAll(); };
$('loadFull').onclick = () => { EVENTS = makeEvents(FAKE_COUNT); refreshAll(); };
$('loadEmpty').onclick = () => { EVENTS = []; refreshAll(); };
window.__preview = { dash, overlay, stats, get events() { return EVENTS; } };
