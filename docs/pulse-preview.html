<!doctype html>
<!--
  Preview of the Pulse tab with synthetic rows run through the real src/pulse/stats.js.
  Serve the project root over HTTP (see docs/ui-preview.html) and open /docs/pulse-preview.html.
  ?drop=1 makes the last hour of upgrades worse than before.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse preview</title>
<style>
  body { margin: 0; background: #0b0d10; color: #c9cdd3; font: 14px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; padding: 24px 16px; }
</style>
</head>
<body>
<main><p>Launcher is bottom-left; the Pulse tab is next to Data.</p></main>
<script type="module">
import { mountDashboard } from '../src/ui/index.js';
import { aggregate, pulseSummary, pulseWindows } from '../src/pulse/stats.js';

let seed = 7;
const R = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const now = Date.now();
const drop = new URLSearchParams(location.search).has('drop');
const rows = [];
const volume = [];
for (let i = 0; i < 9000; i++) {
  const ts = now - R() * 24 * 3600e3;
  const u = 'p' + Math.floor(R() * 120);
  const recent = now - ts < 3600e3;
  if (R() < 0.6) {
    const p = 0.1 + R() * 0.6;
    const stake = 20 + R() * 400;
    const edge = recent && drop ? 0.8 : 0.95;
    rows.push({ id: 'u' + i, kind: 'upgrade', ts, u, stake, returned: R() < p * edge ? (stake / p) * 1.03 : 0 });
  } else {
    const stake = [19, 45, 120][Math.floor(R() * 3)];
    rows.push({ id: 'c' + i, kind: 'case', ts, u, stake, returned: stake * (R() < 0.05 ? 4 + R() * 6 : R() * 1.2) });
  }
}
for (let t = now - 24 * 3600e3, c = 667e6, g = 431e6; t < now; t += 60e3) {
  c += 9000 + R() * 1500;
  g += 6000 + R() * 900;
  volume.push({ ts: t, cases: c, upgrades: g, online: Math.round(2500 + R() * 300) });
}
const w = pulseWindows(now);
const one = (win) => aggregate(rows, { from: win.from, to: win.to, bucketMs: win.to - win.from });
const summary = pulseSummary({ recent: one(w.recent), base: one(w.base), day: one(w.day), hours: aggregate(rows, w.hours) }, volume, now);

let enabled = false;
const pulse = {
  snapshot: () => ({
    enabled,
    otherTab: false,
    collector: enabled ? { running: true, players: 12, queued: 4, recentPlayers: 80, requestsLastHour: 812, rowsLastHour: 3120, backRowsLastHour: 2800, pausedUntil: null, error: null } : null,
    source: 'local',
    summary,
    error: null,
    loading: false,
    updatedAt: Date.now(),
  }),
  refresh: () => {},
  setEnabled: (on) => { enabled = on; },
};
mountDashboard({ getEvents: async () => [], stats: {}, pulse, getStatus: () => ({ version: 'preview' }) });
</script>
</body>
</html>
